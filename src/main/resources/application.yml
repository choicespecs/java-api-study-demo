server:
  port: 8080
  # Return validation error messages in responses (fine for demo, tighten in prod)
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: api-study-demo

  datasource:
    url: jdbc:h2:mem:apidemodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: password

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop   # Recreate schema on each start (demo only!)
    show-sql: false

  h2:
    console:
      enabled: true
      path: /h2-console        # Browse the DB at http://localhost:8080/h2-console

# ============================================================
# Custom JWT settings (used by our JJWT-based auth, NOT OAuth2)
# IMPORTANT: In production store the secret in a secrets manager
#            (AWS Secrets Manager, HashiCorp Vault, etc.)
# ============================================================
app:
  jwt:
    # 256-bit base64-encoded key — DEMO ONLY, rotate in production!
    secret: "dGhpcy1pcy1hLTI1Ni1iaXQtandrLXNlY3JldC1mb3ItZGVtby1wdXJwb3Nlcw=="
    expiration-ms: 900000          # Access token: 15 minutes
    refresh-expiration-ms: 86400000 # Refresh token: 24 hours

# ============================================================
# Resilience4j — circuit breaker, timeout, retry configuration
# ============================================================
resilience4j:
  circuitbreaker:
    instances:
      externalApi:
        register-health-indicator: true
        sliding-window-size: 10          # Evaluate last 10 calls
        minimum-number-of-calls: 5       # Need at least 5 calls before tripping
        failure-rate-threshold: 50       # Open if >=50% of calls fail
        wait-duration-in-open-state: 10s # Stay open for 10s before half-opening
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        event-consumer-buffer-size: 10

  timelimiter:
    instances:
      externalApi:
        timeout-duration: 3s   # Fail fast if external call > 3 seconds
        cancel-running-future: true

  retry:
    instances:
      externalApi:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2   # 500ms → 1000ms → 2000ms

# ============================================================
# Actuator — exposes /actuator/health, /actuator/circuitbreakers, etc.
# ============================================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

# ============================================================
# SpringDoc / Swagger UI
# ============================================================
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.example.apidemo: DEBUG
    org.springframework.security: INFO
